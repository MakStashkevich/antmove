name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' src/model.go)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match src/model.go version v$VERSION" >&2
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Build release archives
        run: ./build.sh

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 antmove_*.tar.gz > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/antmove_*.tar.gz dist/checksums.txt
          --title "antmove $RELEASE_TAG"
          --generate-notes
          --verify-tag
